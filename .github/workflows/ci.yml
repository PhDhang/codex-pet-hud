name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2"

      - name: Show Swift version
        run: swift --version

      - name: Run Swift tests
        run: swift test --disable-sandbox

      - name: Run shell tests
        env:
          CODEX_PET_HUD_TESTING: "1"
        run: |
          for test_script in Tests/Shell/*.bats; do
            bash "$test_script"
          done
